# CMake 4.x removed compatibility with SDL2's pre-3.5 cmake_minimum_required.
# Older CMake versions ignore this variable.
[env]
CMAKE_POLICY_VERSION_MINIMUM = "3.5"

# Cross-compilation to BaseOS (aarch64 glibc, floor 2.31 via bullseye container).
# Only used when building --target aarch64-unknown-linux-gnu.
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
