# MAGI theme file.
#
# Copy this file to a new name ending in .ini, for example "my-theme.ini",
# then change the colours. Files in Themes/ load at start-up; names that
# start with "_" are ignored, so this template is never loaded itself.
#
# Colours are RRGGBB (or RGB shorthand); use a leading # to leave a key out 
# and keep the NERV colour. "heat" takes five colours, separated by commas. 
# Themes are listed in file-name order.

name = MY THEME

# Surfaces, darkest first.
bg0 = 030303
bg1 = 090805
bg2 = 0f0d08
bg3 = 17130c

# Type.
title = ff7a00
text = ffb03b
text_dim = d68a2c
text_faint = 94601e

# Chrome and state.
accent = ff7a00
border = 94601e
glow = 00ff88
alert = ff2a1a

# Elements.
clock = ffb000
battery = 00ff88
battery_shell = 94601e
scrollbar = ffb03b
scrollbar_track = 0f0d08
signal = 00ff88
link = 5a96ff

# Volume/brightness/temperature ramp.
heat = 2a5cff, 00c896, 7ad63a, ffb000, ff2a1a
